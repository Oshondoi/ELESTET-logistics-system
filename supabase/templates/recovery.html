<h2>Восстановление пароля ELESTET</h2>
<p>Введите этот одноразовый код на странице восстановления пароля ELESTET:</p>
<p style="font-size:28px;font-weight:bold;letter-spacing:5px">{{ .Token }}</p>
<p>Никому не сообщайте код. После проверки кода вы сможете задать новый пароль.</p>
<p>Если вы не запрашивали восстановление, проигнорируйте письмо. Ваш пароль не изменён.</p>
