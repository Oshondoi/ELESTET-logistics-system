<h2>Подтверждение почты ELESTET</h2>
<p>Введите этот одноразовый код на открытой странице ELESTET:</p>
<p style="font-size:28px;font-weight:bold;letter-spacing:5px">{{ .Token }}</p>
<p>Никому не сообщайте код. Он подтверждает вашу почту и не заменяет постоянный пароль.</p>
<p>Если вы не запрашивали код, проигнорируйте письмо.</p>
