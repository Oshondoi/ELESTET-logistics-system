<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Проверка сайта</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        padding: 24px;
        background: #ffffff;
        color: #111827;
        font-family: Arial, Helvetica, sans-serif;
      }

      h1 {
        margin: 0;
        text-align: center;
        font-size: clamp(48px, 12vw, 160px);
        line-height: 1;
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <h1>САЙТ ОТКРЫЛСЯ</h1>
  </body>
</html>
