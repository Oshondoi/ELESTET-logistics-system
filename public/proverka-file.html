<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Проверка файла программы</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; }
      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        padding: 24px;
        background: #ffffff;
        color: #111827;
        font-family: Arial, Helvetica, sans-serif;
      }
      main { width: min(1100px, 100%); text-align: center; }
      h1 {
        margin: 0;
        text-align: center;
        font-size: clamp(42px, 10vw, 140px);
        line-height: 1.05;
        font-weight: 900;
      }
      p {
        margin: 28px 0 0;
        font-size: clamp(20px, 3vw, 36px);
        line-height: 1.3;
        font-weight: 700;
      }
      .note {
        margin-top: 18px;
        color: #64748b;
        font-size: clamp(14px, 2vw, 20px);
        font-weight: 400;
      }
      .success { color: #15803d; }
      .error { color: #dc2626; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="result">ПРОВЕРКА...</h1>
      <p id="details">Загружается файл программы. Не закрывайте страницу.</p>
      <p class="note">Проверка не запускает ELESTET и не обращается к Supabase.</p>
    </main>

    <script>
      const result = document.getElementById('result')
      const details = document.getElementById('details')

      const formatSize = (bytes) => {
        if (bytes < 1024 * 1024) return `${Math.round(bytes / 1024)} КБ`
        return `${(bytes / 1024 / 1024).toFixed(2).replace('.', ',')} МБ`
      }

      const showError = (message) => {
        result.textContent = 'ФАЙЛ НЕ ЗАГРУЗИЛСЯ'
        result.className = 'error'
        details.textContent = message
      }

      const runCheck = async () => {
        const startedAt = performance.now()
        const controller = new AbortController()
        const timeoutId = window.setTimeout(() => controller.abort(), 120000)

        try {
          const homeResponse = await fetch(`/?site-check=${Date.now()}`, {
            cache: 'no-store',
            signal: controller.signal,
          })

          if (!homeResponse.ok) {
            throw new Error(`Главная страница вернула ошибку HTTP ${homeResponse.status}`)
          }

          const homeHtml = await homeResponse.text()
          const homeDocument = new DOMParser().parseFromString(homeHtml, 'text/html')
          const mainScript = homeDocument.querySelector('script[type="module"][src]')

          if (!mainScript) {
            throw new Error('Не найден главный файл программы')
          }

          const assetUrl = new URL(mainScript.getAttribute('src'), window.location.origin)
          assetUrl.searchParams.set('site-check', Date.now().toString())

          const assetResponse = await fetch(assetUrl, {
            cache: 'no-store',
            signal: controller.signal,
          })

          if (!assetResponse.ok) {
            throw new Error(`Файл программы вернул ошибку HTTP ${assetResponse.status}`)
          }

          let loadedBytes = 0

          if (assetResponse.body) {
            const reader = assetResponse.body.getReader()
            while (true) {
              const chunk = await reader.read()
              if (chunk.done) break
              loadedBytes += chunk.value.byteLength
              details.textContent = `Загружено: ${formatSize(loadedBytes)}`
            }
          } else {
            loadedBytes = (await assetResponse.arrayBuffer()).byteLength
          }

          const elapsedSeconds = ((performance.now() - startedAt) / 1000).toFixed(1).replace('.', ',')
          result.textContent = 'ФАЙЛ ЗАГРУЗИЛСЯ'
          result.className = 'success'
          details.textContent = `${formatSize(loadedBytes)} за ${elapsedSeconds} сек.`
        } catch (error) {
          if (error && error.name === 'AbortError') {
            showError('Загрузка не завершилась за 2 минуты')
          } else {
            showError(error && error.message ? error.message : 'Соединение было прервано')
          }
        } finally {
          window.clearTimeout(timeoutId)
        }
      }

      void runCheck()
    </script>
  </body>
</html>
